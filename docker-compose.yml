services:

  # ── FIWARE STACK ───────────────────────────────────

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    network_mode: host
    command: --bind_ip_all
    volumes:
      - mongodb:/data

  orion:
    image: fiware/orion-ld:1.13.0-PRE-1858
    container_name: orion
    privileged: true
    network_mode: host
    ipc: host
    depends_on:
      - mongodb
    command: -dbhost 127.0.0.1 -logLevel DEBUG -mongocOnly
    # DDS module disabled: XTypes type resolution never completes between Vulcanexus
    # Humble's Fast DDS (2.6.1) and the Fast DDS bundled in Orion-LD (tried on two
    # Orion-LD releases). Data reaches Orion via orion_bridge.py instead.
    # volumes:
    #   - ./conf/orionld/config-dds.json:/root/config-dds.json:ro   # era ../ergo_dev/conf/...

  crate-db:
    image: crate:5.6.5
    container_name: crate-db
    network_mode: host
    command: crate -Cdiscovery.type=single-node -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=2g

  quantumleap:
    build: ./build/quantumleap   
    container_name: quantumleap
    network_mode: host
    depends_on:
      - crate-db
    environment:
      - CRATE_HOST=127.0.0.1
      - AUTOMATIC_SUBSCRIPTION=true
    volumes:
      - ./conf/quantumleap/subscriptions:/src/ngsi-timeseries-api/src/subscriptions

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    network_mode: host
    depends_on:
      - crate-db
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
    volumes:
      - ./conf/grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
      - ./conf/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./conf/grafana/alerting:/etc/grafana/provisioning/alerting
      - ./conf/grafana/dashboards:/var/lib/grafana/dashboards

  # ── ARISE ERGONOMICS ───────────────────────────────

  arise_ergo_dckr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HOME: /home/ros_user
        ROS_WS: /home/ros_user/catkin_ws
    container_name: arise_ergo_dckr
    privileged: true
    network_mode: host
    ipc: host
    depends_on:
      - orion
      - quantumleap
    environment:
      - DISPLAY=$DISPLAY
      - ROS_DOMAIN_ID=26
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - QT_X11_NO_MITSHM=1
    volumes:
      - "$HOME/.Xauthority:/root/.Xauthority:rw"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
      - "./components/hri_face_detect:/home/ros_user/catkin_ws/src/hri_face_detect"
      - "./components/hri_body_detect:/home/ros_user/catkin_ws/src/hri_body_detect"
      - "./components/hri_rviz:/home/ros_user/catkin_ws/src/hri_rviz"
      - "./components/human_description:/home/ros_user/catkin_ws/src/human_description"
      - "./components/jntlb_fwk_msgs:/home/ros_user/catkin_ws/src/jntlb_fwk_msgs"
      - "./components/ergo_pkg_py:/home/ros_user/catkin_ws/src/ergo_pkg_py"
    devices:
      - /dev/video0
    stdin_open: true
    tty: true

volumes:
  mongodb: ~